name: CI / Publish

# Every push and PR is type-checked and tested. Every push to main that passes also publishes to
# npm as the next patch version (see scripts/next-version.mjs) and tags it vX.Y.Z.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases run one at a time (two pushes must not pick the same version).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  # Every supported platform must pass before a PR can merge (test, test-macos and test-windows are
  # all required checks on main) and before anything is published.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  # Windows: typecheck + tests on a real Windows runner (Git Bash is preinstalled there, as most
  # Windows developers have it).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  publish:
    needs: [test, test-macos, test-windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the vX.Y.Z tag and GitHub Release
      id-token: write # sign provenance (npm and the GitHub attestation)
      attestations: write # store the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Pick the version
        id: check
        # One patch past the latest on npm (0.1.0 → 0.1.1), or package.json's version when it's
        # higher (bump minor/major there by hand). Not committed back; each release gets a tag.
        run: |
          NAME=$(node -p "require('./package.json').name")
          BASE=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$NAME" version 2>/dev/null || true)
          # Newest release tag too: npm can lag a minute behind the previous run's publish.
          TAG=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          VERSION=$(node scripts/next-version.mjs "$BASE" "$LATEST" "$TAG")
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $NAME@$VERSION (npm had ${LATEST:-nothing}, newest tag ${TAG:-none})"

      - name: Pack
        id: pack
        if: steps.check.outputs.publish == 'true'
        # One tarball: the exact file that's signed, published to npm and attached to the release.
        run: echo "tarball=$(npm pack --ignore-scripts --silent | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Sign build provenance
        id: attest
        if: steps.check.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        # Already built and tested above, so skip lifecycle scripts.
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        if: steps.check.outputs.publish == 'true'
        # Tags the commit and attaches the tarball with its Sigstore provenance bundle
        # (verify with: gh attestation verify <tarball> -R DarKnight1346/rein-harness).
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          TARBALL="${{ steps.pack.outputs.tarball }}"
          cp "${{ steps.attest.outputs.bundle-path }}" "$TARBALL.sigstore.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$TARBALL.sigstore.json" --clobber
          else
            gh release create "$TAG" "$TARBALL" "$TARBALL.sigstore.json" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
