name: CI / Publish

# Every push and PR is type-checked and tested. Every push to main that passes also publishes to
# npm as the next patch version (see scripts/next-version.mjs) and tags it vX.Y.Z.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases run one at a time (two pushes must not pick the same version).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vX.Y.Z tag after publishing
      id-token: write # npm provenance (signed "built from this repo" attestation)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Pick the version
        id: check
        # One patch past the latest on npm (0.1.0 → 0.1.1), or package.json's version when it's
        # higher (bump minor/major there by hand). Not committed back; each release gets a tag.
        run: |
          NAME=$(node -p "require('./package.json').name")
          BASE=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$NAME" version 2>/dev/null || true)
          # Newest release tag too: npm can lag a minute behind the previous run's publish.
          TAG=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          VERSION=$(node scripts/next-version.mjs "$BASE" "$LATEST" "$TAG")
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $NAME@$VERSION (npm had ${LATEST:-nothing}, newest tag ${TAG:-none})"

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        # Already built and tested above, so skip the prepublishOnly script.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
